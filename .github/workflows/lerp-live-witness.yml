name: Read-only lerp release witness
on:
  push:
    branches: [audit/lerp-live-release]
permissions:
  contents: read
jobs:
  public-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned test tooling and official Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/lerp-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/lerp-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/lerp-tests/node_modules" >> "$GITHUB_ENV"
      - name: Check exact served hashes and public Chrome behavior
        run: node tests/live.cjs
      - name: Retain read-only public verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lerp-live-release-witness
          path: .local/live-witness/**
          include-hidden-files: true
          retention-days: 7
