name: Lerp browser checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lerp-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
      LERP_BASELINE_ROOT: ${{ github.workspace }}/.local/baseline
      LERP_SHARED_ROOT: ${{ github.workspace }}/.local/shared
      LERP_SCREENSHOTS: ${{ github.workspace }}/.local/review
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out original lerp page
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3d5b1fc4ed3a12548fb6e797d1da2fed1ee2835e
          path: .local/baseline
          persist-credentials: false
      - name: Read exact shipped shared assets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrentSterling/trentsterling.github.io
          ref: af3958a591e18b0126904fffd892b11974ef0dd5
          path: .local/shared
          persist-credentials: false
          sparse-checkout: assets
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test deterministic smoothing and source preservation
        run: node --test tests/*.test.cjs
      - name: Install pinned test tooling and official Chrome
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/lerp-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/lerp-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/lerp-tests/node_modules" >> "$GITHUB_ENV"
      - name: Test rendered page, actual canvases and theme controls
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 300s node tests/browser.cjs
      - name: Save original and updated page evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lerp-review-${{ github.event.pull_request.number }}
          path: .local/review/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
